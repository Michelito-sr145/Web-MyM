<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Mirá el detalle, talles, colores y precio de este producto.">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/Local/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/img/Local/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/img/Local/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/Local/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Plantillas Master" />
    <link rel="manifest" href="/img/Local/favicons/site.webmanifest" />
    
    <title>Producto | Plantillas Master</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/vista.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="mini-logo">
            <a href="index.html">
                <img src="img/Local/PlantillaMaster.png" alt="logo" class="logo">
            </a>
        </div>
        <div class="fa-solid fa-bars" id="menu-icon"></div>
        <ul class="navbar">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="carrito.html">Carrito</a></li>
        </ul>
        <div class="social-icons">
            <a class="linkSocial fc"><i class="fa-brands fa-square-facebook"></i></a>
            <a class="linkSocial ig"><i class="fa-brands fa-square-instagram"></i></a>
            <a class="linkSocial wsp"><i class="fa-brands fa-square-whatsapp"></i></a>
        </div>
    </header>

    <main>
        <!-- Banner y Opciones -->
        <section class="opciones">
            <img src="img/Local/Banner.jpg" alt="Banner" class="banner">
            <div class="categoria-botones">
                <button class="principal" id="btn-sec-plantilla">Plantillas</button>
                <div class="secundarios">
                    <button id="btn-sec-llavero">Llaveros</button>
                    <button id="btn-sec-media">Medias</button>
                    <button id="btn-sec-todo">Todos</button>
                </div>
            </div>
        </section>


        <!-- Vista del Producto -->
        <section class="vista-noCode">
            <div>
                <p class="no-code"> Producto no encontrado</p>
            </div>
        </section>

        <section class="vista-producto">
            <div class="vp-producto">
                <div class="vp-presentacion">
                    <div class="vp-carrusel">
                        <div class="vp-cimg"></div>
                        <label id="vp-prev" class="vp-prev">&#10094;</label>
                        <label id="vp-next" class="vp-next">&#10095;</label>
                    </div>
                </div> 
                <div class="vp-detalles">
                    <div class="vp-titulo">
                        <h1 id="vp-nombre"></h1>
                    </div>
                    <p id="vp-Descripcion"></p>
                    <form class="vp-form-valores" id="vp-valores">
                        <div class="vp-input-talle">
                            <label for="fvp-talle" id="fvp-label-talle"></label>
                            <select id="fvp-talle" name="fvp-talle"></select>
                        </div>
                        <div class="vp-input-color">
                            <label for="fvp-color">Color:</label>
                            <select id="fvp-color" name="fvp-color"></select>
                        </div>
                        <div class="vp-input-cant">
                            <label for="fvp-cantidad">Cantidad:</label>
                            <div class="vp-cantidad-control">
                                <button type="button" class="minus" aria-label="Disminuir cantidad">
                                    <i class="fa-regular fa-square-minus"></i>
                                </button>
                                <input type="number" id="fvp-cantidad" name="fvp-cantidad" min="1" value="1">
                                <button type="button" class="plus" aria-label="Aumentar cantidad">
                                    <i class="fa-regular fa-square-plus"></i>
                                </button>
                            </div>
                        </div>
                        <h2 id="vp-precio"></h2>
                        <button class="vp-comprar" id="agregar_carrito">agregar carrito</button>
                    </form>
                </div>
            </div>
        </section>




        <!-- Zona de Productos Sugerentes -->
        <section class="vista-sugerencia">
            <h2 class="vs-title"></h2>
            <div class="vs-carrusel">
                <div class="vs-carrusel-items">
                </div>
                <button class="vs-prev">&#10094;</button>
                <button class="vs-next">&#10095;</button>
            </div>
        </section>


        <section class="carrito-ico">
            <a href="carrito.html" class="icono-car">
                <span class="carrito-cantidad" id="carrito-cantidad">0</span>
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
        </section>

    </main>


    <!-- Footer -->
    <footer>
        <section class="info">
            <div class="info2">
                <p>Síguenos:</p>
                <div class="social-icons">
                    <a class="linkSocial fc"><i class="fa-brands fa-square-facebook"></i></a>
                    <a class="linkSocial ig"><i class="fa-brands fa-square-instagram"></i></a>
                    <a class="linkSocial wsp"><i class="fa-brands fa-square-whatsapp"></i></a>
                </div>
            </div>
            <div class="mini-mapa">
                <p>Nos Ubicamos:</p>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3283.975067332465!2d-58.40274712470483!3d-34.60479197295386!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccaeb7ce7786f%3A0xd6224e8f0d7a6786!2sPlantillas%20Master%20Local%20%228%22!5e0!3m2!1ses!2sar!4v1756238111547!5m2!1ses!2sar" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
        <p>&copy; 2025 Plantillas Master MyM</p>
    </footer>

    <!-- Scripts -->
    <script src="js/productos.js"></script>
    <script src="js/vista.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
